services:
  orders-db:
    image: postgres:16
    container_name: orderflow-orders-db
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:?set ORDERS_DB_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - orders-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_user -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  inventory-db:
    image: postgres:16
    container_name: orderflow-inventory-db
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory_user 
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:?set INVENTORY_DB_PASSWORD in .env}
    ports:
      - "5434:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  payments-db:
    image: postgres:16
    container_name: orderflow-payments-db
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments_user
      POSTGRES_PASSWORD: ${PAYMENTS_DB_PASSWORD:?set PAYMENTS_DB_PASSWORD in .env}
    ports:
      - "5435:5432"
    volumes:
      - payments-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments_user -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10
    
  rabbitmq:
    image: rabbitmq:4-management
    container_name: orderflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672" # Programs connect to RabbitMQ here
      - "15672:15672" # You open the RabbitMQ management website here
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  inventory-api:
    build:
      context: .  #Build using the repository root as the build context.
      dockerfile: src/Inventory/OrderFlow.Inventory.Api/Dockerfile
    container_name: orderflow-inventory-api
    environment:
      ConnectionStrings__InventoryDb: "Host=inventory-db;Port=5432;Database=inventory;Username=inventory_user;Password=${INVENTORY_DB_PASSWORD}"
      Database__MigrateOnStartup: "true"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    ports:
      - "5213:8080"
    depends_on:
      inventory-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  orders-api:
    build:
      context: .
      dockerfile: src/Orders/OrderFlow.Orders.Api/Dockerfile
    container_name: orderflow-orders-api
    environment:
      ConnectionStrings__OrdersDb: "Host=orders-db;Port=5432;Database=orders;Username=orders_user;Password=${ORDERS_DB_PASSWORD}"
      InventoryService__BaseUrl: "http://inventory-api:8080"
      Database__MigrateOnStartup: "true"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Chaos__CrashBeforePublish: "${CHAOS_CRASH_BEFORE_PUBLISH:-false}"
    ports:
      - "5214:8080"
    depends_on:
      orders-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    
  payments-api:
    build:
      context: .
      dockerfile: src/Payments/OrderFlow.Payments.Api/Dockerfile
    container_name: orderflow-payments-api
    environment:
      ConnectionStrings__PaymentsDb: "Host=payments-db;Port=5432;Database=payments;Username=payments_user;Password=${PAYMENTS_DB_PASSWORD}"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      PaymentSimulation__ForceFailure: "${PAYMENT_FORCE_FAILURE:-false}"
      Database__MigrateOnStartup: "true"
    ports:
      - "5215:8080"
    depends_on:
      payments-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
        
volumes:
  orders-db-data:
  inventory-db-data:
  payments-db-data: